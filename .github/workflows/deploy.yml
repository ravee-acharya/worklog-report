name: Deploy Worklog Report

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy after tests pass"
        required: true
        default: development
        type: choice
        options:
          - development
          - production
      approve_major_version:
        description: "Approve a MAJOR version upgrade. Existing installs will NOT auto-update - each site admin must upgrade by hand. Leave off unless you intend this."
        required: false
        default: false
        type: boolean

env:
  # Pinned deliberately. This was unpinned, so CI silently moved up to
  # @forge/cli 15.0.0 and every run began failing: 15 requires an explicit
  # --environment for commands that used to fall back to a default
  # development environment, and prompting for one kills a non-TTY runner.
  # Bump this on purpose, after reading the release notes.
  FORGE_CLI_VERSION: "15.0.0"

  FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
  FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

  # The development environment is installed on one site only — it exists to
  # verify changes, not to serve anyone.
  FORGE_DEV_SITE: dashtech.atlassian.net

  # Every site the production app is installed on, space-separated.
  #
  # `forge deploy` publishes code to the environment and all installations
  # pick it up, so this list is NOT needed for ordinary changes. It matters
  # when the manifest gains a scope: each installation stays pinned to the
  # permission set it was installed with until it is upgraded individually,
  # and an un-upgraded site silently runs new code without the permission it
  # expects. Add a site here as soon as it is installed, or it will be the
  # one left behind.
  FORGE_PROD_SITES: "dashtech.atlassian.net sportscentral.atlassian.net"

  # The internal, unlicensed clone of the app: same code, different Forge
  # app id, licensing stripped (see scripts/make-internal-manifest.js). It
  # exists so the team can keep using the report for free now that the
  # Marketplace app is licensed. Its id lives in the FORGE_INTERNAL_APP_ID
  # repo variable; when that is unset the internal job simply skips.
  FORGE_INTERNAL_SITE: dashtech.atlassian.net

jobs:
  # Validates the code the same way local development does: manifest checks,
  # forge lint, type-check, tests with coverage, lint, and static security scan.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `npm run security` (part of `npm run ci`) shells out to semgrep,
      # a Python tool that isn't part of the npm dependency tree.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep

      # forge lint (part of `npm run ci`) needs the Forge CLI, which is a
      # global install on dev machines, not a project dependency.
      - run: npm install -g @forge/cli@"$FORGE_CLI_VERSION"

      # First run of any forge command shows an interactive analytics opt-in
      # prompt, which crashes on a non-TTY CI runner ("Prompts can not be
      # meaningfully rendered in non-TTY environments"). Answer it up front.
      - run: forge settings set usage-analytics false

      - name: Run full validation gate
        run: npm run ci

  # Every push to main auto-deploys to development. No approval gate — this
  # environment is for verification, not for real users.
  deploy-development:
    needs: verify
    if: github.event_name == 'push' || github.event.inputs.target == 'development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Install the CLI explicitly and invoke `forge` directly. Do NOT use
      # `npx forge` here: the bare name `forge` on npm is an unrelated package
      # (forge@2.3.0), so npx silently fetches the wrong tool and fails with
      # "Cannot find module 'settings'".
      - run: npm install -g @forge/cli@"$FORGE_CLI_VERSION"

      - run: forge settings set usage-analytics false

      - name: Deploy to development
        run: forge deploy --environment development --non-interactive

      # `forge deploy` alone is enough for code-only changes: the already
      # installed app picks them up. It is NOT enough when the manifest gains
      # new scopes — the installation stays pinned to the old permission set
      # until it is upgraded.
      #
      # `--upgrade` only works on an installation that already exists, and the
      # development install has been removed from the site before now, which
      # failed this step. So fall back to a fresh install when the upgrade
      # finds nothing to upgrade. Between them the step is idempotent: it
      # restores a missing install and is a no-op once the site is current.
      # --confirm-scopes auto-grants new permissions in development only.
      - name: Install or upgrade development installation
        run: |
          forge install --upgrade --non-interactive --confirm-scopes \
            --site "$FORGE_DEV_SITE" --product jira --environment development \
          || forge install --non-interactive --confirm-scopes \
            --site "$FORGE_DEV_SITE" --product jira --environment development

  # Production only deploys from a manual workflow run, and only after the
  # `production` GitHub Environment's required reviewers approve it. Configure
  # that approval gate under Settings → Environments → production.
  deploy-production:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # See the note in deploy-development: `npx forge` resolves to the wrong
      # npm package, so install @forge/cli and call `forge` directly.
      - run: npm install -g @forge/cli@"$FORGE_CLI_VERSION"

      - run: forge settings set usage-analytics false

      # A manifest change that forces a major version (adding licensing, for
      # one) is never approved implicitly: existing installations stop
      # auto-updating and every site admin has to upgrade by hand. That has
      # to be a conscious choice made at dispatch time, not a flag quietly
      # living in the repo approving every future major change too.
      - name: Deploy to production
        run: |
          if [ "${{ inputs.approve_major_version }}" = "true" ]; then
            echo "::warning::Approving MAJOR_VERSION_RULE - existing installs will not auto-update until each site admin upgrades."
            forge deploy --environment production --non-interactive --approve MAJOR_VERSION_RULE
          else
            forge deploy --environment production --non-interactive
          fi

      # Upgrades every installed production site, not just the first.
      #
      # Deliberately omits --confirm-scopes. A code-only change upgrades
      # silently, which is the normal case. If the manifest gained new scopes,
      # this fails rather than auto-granting new permissions on a live site —
      # then a Jira admin grants consent deliberately (see DEPLOYMENT.md).
      #
      # Every site is attempted even after one fails, and the job fails at the
      # end if any did. Stopping at the first failure would leave the
      # remaining sites both un-upgraded and unreported — the silent
      # half-migrated state this step exists to prevent.
      - name: Upgrade production installations
        run: |
          failed=""
          licensed=""
          for site in $FORGE_PROD_SITES; do
            echo "::group::Upgrading $site"
            out=$(forge install --upgrade --non-interactive \
                    --site "$site" --product jira --environment production 2>&1) && ok=1 || ok=0
            echo "$out"

            if [ "$ok" = "1" ]; then
              echo "$site is up to date."
            elif echo "$out" | grep -qi "Upgrading to a licensed app is not permitted"; then
              # Expected, not a fault. Atlassian does not let the CLI convert an
              # existing free installation into a licensed one — the site admin
              # must upgrade it from Manage apps / Admin Hub instead. Failing the
              # job here would leave production permanently red for a restriction
              # no change to this repo can lift.
              echo "::warning::$site must be upgraded by its Jira admin from Manage apps — the CLI cannot upgrade a free install to a licensed one."
              licensed="$licensed $site"
            else
              echo "::error::Upgrade failed for $site — it is still on its previous version."
              failed="$failed $site"
            fi
            echo "::endgroup::"
          done

          if [ -n "$licensed" ]; then
            echo "::warning::Awaiting an admin upgrade in Manage apps for:$licensed"
          fi

          if [ -n "$failed" ]; then
            echo "::error::Production code is deployed, but these installations were not upgraded:$failed"
            echo "See DEPLOYMENT.md — a scope change needs a Jira admin on each site to consent."
            exit 1
          fi
          echo "All production installations handled."

  # Deploys the SAME commit as the internal clone, so a feature shipped to
  # the Marketplace app reaches the team's free copy in the same run. It is
  # deliberately a separate job rather than extra steps on deploy-production:
  # it rewrites manifest.yml, and doing that in the job that publishes the
  # paid app risks deploying the clone's id over it.
  #
  # Runs after production and only if production succeeded, so the paid app
  # is never behind the free one.
  deploy-internal:
    needs: deploy-production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm install -g @forge/cli@"$FORGE_CLI_VERSION"

      - run: forge settings set usage-analytics false

      - name: Skip if no internal app is configured
        id: guard
        run: |
          if [ -z "${{ vars.FORGE_INTERNAL_APP_ID }}" ]; then
            echo "::notice::FORGE_INTERNAL_APP_ID is not set - skipping the internal deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Rewrites the checked-out manifest only. Never committed.
      - name: Point the manifest at the internal app
        if: steps.guard.outputs.skip == 'false'
        env:
          FORGE_INTERNAL_APP_ID: ${{ vars.FORGE_INTERNAL_APP_ID }}
        run: node scripts/make-internal-manifest.js

      - name: Deploy the internal app
        if: steps.guard.outputs.skip == 'false'
        run: forge deploy --environment production --non-interactive

      # The clone is free, so unlike the Marketplace app its installs CAN be
      # upgraded from the CLI. --confirm-scopes is safe here: it is our own
      # internal app on our own site, not a customer's.
      - name: Install or upgrade the internal app
        if: steps.guard.outputs.skip == 'false'
        run: |
          forge install --upgrade --non-interactive --confirm-scopes \
            --site "$FORGE_INTERNAL_SITE" --product jira --environment production \
          || forge install --non-interactive --confirm-scopes \
            --site "$FORGE_INTERNAL_SITE" --product jira --environment production
