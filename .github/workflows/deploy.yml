name: Deploy Worklog Report

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to deploy after tests pass"
        required: true
        default: development
        type: choice
        options:
          - development
          - production

env:
  FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
  FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

jobs:
  # Validates the code the same way local development does: manifest checks,
  # forge lint, type-check, tests with coverage, lint, and static security scan.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `npm run security` (part of `npm run ci`) shells out to semgrep,
      # a Python tool that isn't part of the npm dependency tree.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep

      # forge lint (part of `npm run ci`) needs the Forge CLI, which is a
      # global install on dev machines, not a project dependency.
      - run: npm install -g @forge/cli

      # First run of any forge command shows an interactive analytics opt-in
      # prompt, which crashes on a non-TTY CI runner ("Prompts can not be
      # meaningfully rendered in non-TTY environments"). Answer it up front.
      - run: forge settings set usage-analytics false

      - name: Run full validation gate
        run: npm run ci

  # Every push to main auto-deploys to development. No approval gate — this
  # environment is for verification, not for real users.
  deploy-development:
    needs: verify
    if: github.event_name == 'push' || github.event.inputs.target == 'development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Install the CLI explicitly and invoke `forge` directly. Do NOT use
      # `npx forge` here: the bare name `forge` on npm is an unrelated package
      # (forge@2.3.0), so npx silently fetches the wrong tool and fails with
      # "Cannot find module 'settings'".
      - run: npm install -g @forge/cli

      - run: forge settings set usage-analytics false

      - name: Deploy to development
        run: forge deploy --environment development --non-interactive

  # Production only deploys from a manual workflow run, and only after the
  # `production` GitHub Environment's required reviewers approve it. Configure
  # that approval gate under Settings → Environments → production.
  deploy-production:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # See the note in deploy-development: `npx forge` resolves to the wrong
      # npm package, so install @forge/cli and call `forge` directly.
      - run: npm install -g @forge/cli

      - run: forge settings set usage-analytics false

      - name: Deploy to production
        run: forge deploy --environment production --non-interactive
